[package]
name = "frameforge-core"
version = "1.0.0"
edition = "2021"
description = "FrameForge 像素工具箱 WASM 核心：色键去背/像素化/调色板量化/GIF 编解码/Sprite Sheet"

[lib]
crate-type = ["cdylib"]

[dependencies]
gif = "0.12"
color_quant = "1.1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = true
